name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main   # runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Run build.py — generates index.html, blog pages, sitemap
      - name: Build site
        working-directory: ./site
        run: python build.py
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID:   ${{ secrets.GOOGLE_PLACE_ID }}

      # 4. Copy built files into a clean deploy/ folder
      #    This prevents a "site/" subfolder being created on the server
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp -r site/. deploy/
          rm -f deploy/build.py deploy/check.py

      # 5. Deploy deploy/ folder contents to Hostinger public_html/
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:       ${{ secrets.FTP_HOST }}
          username:     ${{ secrets.FTP_USER }}
          password:     ${{ secrets.FTP_PASS }}
          local-dir:    ./deploy/
          server-dir:   /public_html/
          exclude: |
            **/.git*
            **/.git*/**

